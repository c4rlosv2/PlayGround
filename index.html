ion-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.section-title{font-size:14px;font-weight:800;letter-spacing:.02em}.counter{display:flex;align-items:center;gap:14px}.stepper{width:38px;height:38px;border:1px solid #343443;background:#1a1a24;border-radius:13px;font-size:23px;line-height:1;color:var(--cyan)}.count{min-width:28px;text-align:center;font-size:21px;font-weight:850}.field-label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:18px 0 8px}.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.name-field{position:relative}.name-field .number{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#747286;font-size:12px;font-weight:800}.name-field input,.select-wrap select{width:100%;border:1px solid #2d2d3a;background:#0b0b11;color:var(--text);border-radius:13px;padding:13px 12px 13px 34px;font-size:14px;min-width:0}.name-field input::placeholder{color:#696778}.name-field input.invalid{border-color:var(--danger);box-shadow:0 0 0 2px #ff739522}.select-wrap{position:relative}.select-wrap select{padding-left:14px;appearance:none}.select-wrap:after{content:"⌄";position:absolute;right:15px;top:9px;color:var(--cyan);pointer-events:none;font-size:18px}.helper{margin:10px 0 0;font-size:11px;color:#777588}.button{width:100%;min-height:56px;border:0;border-radius:16px;padding:15px 18px;font-weight:850;font-size:15px;transition:transform .15s,filter .15s,background .15s}.button:active{transform:scale(.985)}.button-primary{color:#061111;background:linear-gradient(100deg,var(--cyan),#8ff5d0);box-shadow:0 10px 28px #5cf4ee20}.button-primary:hover{filter:brightness(1.08)}.button-secondary{background:#1b1b26;border:1px solid #353542;color:var(--text)}.button-quiet{background:transparent;border:1px solid #353542;color:#c1bfd0}.button-danger{background:#ff73951b;border:1px solid #ff739544;color:#ff9ab1}.button-small{min-height:46px;font-size:13px;padding:12px 14px}.button-row{display:flex;g 22px;margin-bottom:14px;background:linear-gradient(135deg,#171727,#101018);border:1px solid #35324c;border-radius:22px}.turn-card:after{content:"";position:absolute;width:135px;height:135px;border-radius:50%;background:#a885ff14;right:-50px;top:-60px;filter:blur(2px)}.turn-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--violet);font-weight:850}.turn-name{font-size:34px;letter-spacing:-.05em;line-height:1.08;font-weight:900;margin:9px 0 5px;overflow-wrap:anywhere}.turn-hint{font-size:12px;color:var(--muted)}.status-title{font-size:13px;font-weight:850;margin:22px 0 10px;display:flex;justify-content:space-between}.status-list{display:grid;gap:8px}.status-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:1px solid #24242f;background:#101016;border-radius:13px;gap:10px}.status-name{font-size:13px;font-weight:750}.status-state{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#a6a4b7;white-space:nowrap}.status-character{font-size:11px;color:var(--green);margin-top:4px;line-height:1.35}.status-row.done{border-color:#73e8a43d;background:#73e8a409}.status-row.done .status-state{color:var(--green)}.round-actions{display:grid;gap:10px;margin-top:16px}.secondary-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-hero{margin:8px 0 23px}.summary-hero h2{font-size:38px;letter-spacing:-.055em;line-height:1;margin:0 0 10px}.summary-hero p{color:var(--muted);margin:0;font-size:14px}.winner-badge{color:var(--green);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.modal-backdrop{position:fixed;inset:0;z-index:5;background:#000b;display:grid;place-items:center;padding:22px;backdrop-filter:blur(8px)}.modal{width:min(100%,420px);background:#15151e;border:1px solid #393947;border-radius:23px;padding:23px;box-shadow:0 30px 90px #000b;animation:arrive .2s ease}.modal h2{font-size:23px;letter-spacing:-.03em;margin:0 0 9px}.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px}.modal .button{margin-top:10px}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;background:#272733;color:white;border:1px solid #494958;border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}footer{color:#575666;text-align:center;font-size:10px;margin-top:28px;padding-bottom:3px}
@media(max-width:370px){.app{padding-left:15px;padding-right:15px}.panel{padding:16px}.player-grid{gap:8px}.name-field input{padding-right:7px}.secondary-actions{grid-template-columns:1fr}.turn-name{font-size:30px}}
@media(min-height:850px){.app{padding-top:calc(25px + env(safe-area-inset-top))}.topbar{margin-bottom:43px}.hero h1{margin-bottom:20px}}

<body>

</div>

<script>
'use strict';
const characters = [
  // [personaje, anime, categoría]
  ['Naruto Uzumaki','Naruto','shonen'],['Sasuke Uchiha','Naruto','shonen'],['Sakura Haruno','Naruto','shonen'],['Kakashi Hatake','Naruto','shonen'],['Monkey D. Luffy','One Piece','shonen'],['Roronoa Zoro','One Piece','shonen'],['Nami','One Piece','shonen'],['Sanji','One Piece','shonen'],['Tony Tony Chopper','One Piece','shonen'],['Son Goku','Dragon Ball','shonen'],['Vegeta','Dragon Ball','shonen'],['Gohan','Dragon Ball','shonen'],['Piccolo','Dragon Ball','shonen'],['Ichigo Kurosaki','Bleach','shonen'],['Rukia Kuchiki','Bleach','shonen'],['Orihime Inoue','Bleach','shonen'],
  ['Izuku Midoriya','My Hero Academia','shonen'],['Katsuki Bakugo','My Hero Academia','shonen'],['Shoto Todoroki','My Hero Academia','shonen'],['All Might','My Hero Academia','shonen'],['Tanjiro Kamado','Demon Slayer','shonen'],['Nezuko Kamado','Demon Slayer','shonen'],['Zenitsu Agatsuma','Demon Slayer','shonen'],['Inosuke Hashibira','Demon Slayer','shonen'],['Yuji Itadori','Jujutsu Kaisen','shonen'],['Satoru Gojo','Jujutsu Kaisen','shonen'],['Megumi Fushiguro','Jujutsu Kaisen','shonen'],['Nobara Kugisaki','Jujutsu Kaisen','shonen'],['Eren Yeager','Attack on Titan','shonen'],['Mikasa Ackerman','Attack on Titan','shonen'],['Levi Ackerman','Attack on Titan','shonen'],['Armin Arlert','Attack on Titan','shonen'],['Light Yagami','Death Note','shonen'],['L','Death Note','shonen'],['Edward Elric','Fullmetal Alchemist','shonen'],['Alphonse Elric','Fullmetal Alchemist','shonen'],['Roy Mustang','Fullmetal Alchemist','shonen'],['Saitama','One-Punch Man','shonen'],['Genos','One-Punch Man','shonen'],['Gon Freecss','Hunter x Hunter','shonen'],['Killua Zoldyck','Hunter x Hunter','shonen'],['Hisoka','Hunter x Hunter','shonen'],['Yusuke Urameshi','Yu Yu Hakusho','shonen'],['Sailor Moon (Usagi)','Sailor Moon','shonen'],['Jotaro Kujo','JoJo’s Bizarre Adventure','shonen'],['Dio Brando','JoJo’s Bizarre Adventure','shonen'],['Shoyo Hinata','Haikyu!!','shonen'],['Kageyama Tobio','Haikyu!!','shonen'],['Anya Forger','Spy x Family','shonen'],['Loid Forger','Spy x Family','shonen'],
  ['Astro Boy','Astro Boy','classic'],['Doraemon','Doraemon','classic'],['Nobita Nobi','Doraemon','classic'],['Kenshin Himura','Rurouni Kenshin','classic'],['Inuyasha','Inuyasha','classic'],['Kagome Higurashi','Inuyasha','classic'],['Ranma Saotome','Ranma ½','classic'],['Lum','Urusei Yatsura','classic'],['Shinji Ikari','Neon Genesis Evangelion','classic'],['Rei Ayanami','Neon Genesis Evangelion','classic'],['Asuka Langley','Neon Genesis Evangelion','classic'],['Spike Spiegel','Cowboy Bebop','classic'],['Faye Valentine','Cowboy Bebop','classic'],['Sakura Kinomoto','Cardcaptor Sakura','classic'],['Tomoyo Daidouji','Cardcaptor Sakura','classic'],['Kiki','Kiki: entregas a domicilio','classic'],['Chihiro Ogino','El viaje de Chihiro','classic'],['Totoro','Mi vecino Totoro','classic'],['Howl','El castillo ambulante','classic'],['San','La princesa Mononoke','classic'],['Ash Ketchum','Pokémon','classic'],['Pikachu','Pokémon','classic'],['Misty','Pokémon','classic'],['Yugi Muto','Yu-Gi-Oh!','classic'],['Seto Kaiba','Yu-Gi-Oh!','classic'],['Sailor Mars (Rei)','Sailor Moon','classic'],['Tuxedo Mask','Sailor Moon','classic'],['Conan Edogawa','Detective Conan','classic'],['Lupin III','Lupin the Third','classic'],['Nausicaä','Nausicaä del Valle del Viento','classic'],['Taichi Yagami','Digimon Adventure','classic'],['Agumon','Digimon Adventure','classic'],['Ryo Saeba','City Hunter','classic'],['Guts','Berserk','classic'],['Griffith','Berserk','classic'],['Koro-sensei','Assassination Classroom','classic'],['Kenshiro','El puño de la Estrella del Norte','classic'],['Tsubasa Ozora','Captain Tsubasa','classic'],['Hamtaro','Hamtaro','classic'],['Arale Norimaki','Dr. Slump','classic'],
  ['Kirito','Sword Art Online','isekai'],['Asuna Yuuki','Sword Art Online','isekai'],['Subaru Natsuki','Re:Zero','isekai'],['Emilia','Re:Zero','isekai'],['Rem','Re:Zero','isekai'],['Kazuma Satou','KonoSuba','isekai'],['Aqua','KonoSuba','isekai'],['Megumin','KonoSuba','isekai'],['Rimuru Tempest','That Time I Got Reincarnated as a Slime','isekai'],['Raphtalia','The Rising of the Shield Hero','isekai'],['Naofumi Iwatani','The Rising of the Shield Hero','isekai'],['Ainz Ooal Gown','Overlord','isekai'],['Albedo','Overlord','isekai'],['Tanya Degurechaff','Saga of Tanya the Evil','isekai'],['Sora','No Game No Life','isekai'],['Shiro','No Game No Life','isekai'],['Katarina Claes','My Next Life as a Villainess','isekai'],['Rudeus Greyrat','Mushoku Tensei','isekai'],['Frieren','Frieren: Beyond Journey’s End','isekai'],['Fern','Frieren: Beyond Journey’s End','isekai'],['Marcille Donato','Delicious in Dungeon','isekai'],['Laios Touden','Delicious in Dungeon','isekai'],['Maomao','The Apothecary Diaries','isekai'],['Yona','Yona of the Dawn','isekai'],['Violet Evergarden','Violet Evergarden','isekai'],['Holo','Spice and Wolf','isekai'],['Shuna','That Time I Got Reincarnated as a Slime','isekai'],['Seiya Ryuuguuin','Cautious Hero','isekai'],['Maple','Bofuri','isekai'],['Mitsuha Yamano','Saving 80,000 Gold in Another World','isekai'],['Euphyllia Magenta','The Magical Revolution','isekai'],['Lloyd de Saloum','The Genius Prince’s Guide','isekai'],['Kumoko','So I’m a Spider, So What?','isekai'],['Bell Cranel','Is It Wrong to Try to Pick Up Girls in a Dungeon?','isekai'],['Ariel','The Little Mermaid (anime)','isekai'],['Natsume Takashi','Natsume’s Book of Friends','isekai'],['Ashitaka','La princesa Mononoke','classic'],['Saber (Artoria)','Fate/stay night','classic'],['Rin Tohsaka','Fate/stay night','classic'],['Maka Albarn','Soul Eater','shonen'],['Shigeo Kageyama (Mob)','Mob Psycho 100','shonen'],['Reigen Arataka','Mob Psycho 100','shonen']
].map(([name, anime, category]) => ({name, anime, category}));

const app = document.getElementById('app');
const overlayRoot = document.getElementById('overlay-root');
const categoryNames = {all:'Todos mezclados',shonen:'Shonen popular',classic:'Clásicos',isekai:'Isekai y fantasía'};
const state = {screen:'lobby', count:4, names:['','','',''], category:'all', players:[], revealIndex:0, revealOpen:false, turnIndex:0, recallIndex:null, recallOpen:false, toastTimer:null};
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const activePlayers = () => state.players.filter(player => !player.guessed);
const playerByIndex = index => state.players[index];
const initials = name => name.trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
function showToast(message){
  const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=message;document.body.appendChild(node);
  clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>node.remove(),2400);
}
function render(){
  overlayRoot.innerHTML='';
  if(state.screen==='lobby') renderLobby();
  else if(state.screen==='setup') renderSetup();
  else if(state.screen==='reveal') renderReveal();
  else if(state.screen==='round') renderRound();
  else renderSummary();
}
function renderLobby(){
  const inputs=Array.from({length:state.count},(_,i)=>`<label class="name-field"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="sr-only">Nombre del jugador ${i+1}</span><input maxlength="22" autocomplete="off" data-name="${i}" placeholder="Nombre del jugador ${i+1}" value="${esc(state.names[i]||'')}"></label>`).join('');
  app.innerHTML=`<section class="screen"><div class="hero"><p class="eyebrow">Pasa el teléfono · juega en grupo</p><h1>¿Quién <span>soy?</span></h1><p class="lead">Todos conocen a los demás… menos a sí mismos. Haz preguntas, descubre tu personaje y no mires la pantalla equivocada. 👀</p></div><div class="panel"><div class="section-head"><span class="section-title">Jugadores</span><div class="counter"><button class="stepper" type="button" data-action="minus" aria-label="Quitar jugador">−</button><span class="count" aria-live="polite">${state.count}</span><button class="stepper" type="button" data-action="plus" aria-label="Añadir jugador">+</button></div></div><div class="player-grid">${inputs}</div><label class="field-label" for="category">Universo anime</label><div class="select-wrap"><select id="category">${Object.entries(categoryNames).map(([key,label])=>`<option value="${key}" ${state.category===key?'selected':''}>${label}</option>`).join('')}</select></div><p class="helper">Elige un mínimo de 2 y un máximo de 12 jugadores.</p><button class="button button-primary lobby-action" type="button" data-action="start">Comenzar partida <span aria-hidden="true">↗</span></button></div><p class="footnote">🎴 Personajes al azar · sin repetidos · todo se queda en este teléfono</p></section>`;
}
function syncLobby(){
  app.querySelectorAll('[data-name]').forEach(input=>{state.names[Number(input.dataset.name)]=input.value;input.classList.remove('invalid');});
  const selector=document.getElementById('category');if(selector)state.category=selector.value;
}
function startGame(){
  syncLobby();
  const names=state.names.slice(0,state.count).map(value=>value.trim());
  const inputs=[...app.querySelectorAll('[data-name]')];let invalid=false;
  names.forEach((name,index)=>{if(!name||/^jugador\s*\d+$/i.test(name)){inputs[index]?.classList.add('invalid');invalid=true;}});
  const normalized=names.map(name=>name.toLocaleLowerCase('es'));
  if(new Set(normalized).size!==normalized.length){
    const duplicate=normalized.findIndex((name,index)=>normalized.indexOf(name)!==index);inputs[duplicate]?.classList.add('invalid');
    showToast('Usen nombres distintos para no confundir los turnos.');return;
  }
  if(invalid){showToast('Escribe un nombre real para cada jugador.');inputs.find(input=>input.classList.contains('invalid'))?.focus();return;}
  const pool=characters.filter(character=>state.category==='all'||character.category===state.category);
  if(pool.length<state.count){showToast('No hay suficientes personajes para esa categoría.');return;}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  state.players=names.map((name,index)=>({id:index,name,character:pool[index],guessed:false}));
  state.revealIndex=0;state.revealOpen=false;state.turnIndex=0;state.recallIndex=null;state.screen='setup';render();
}
function renderSetup(){
  const isRecall=state.recallIndex!==null;const viewerIndex=isRecall?state.recallIndex:state.revealIndex;const player=playerByIndex(viewerIndex);
  app.innerHTML=`<section class="screen center-screen"><div class="card-icon" aria-hidden="true">${isRecall?'🔐':'📱'}</div><p class="eyebrow">${isRecall?'Consulta privada':'Reparto secreto'} · ${viewerIndex+1} de ${state.players.length}</p><h2>Pásale el teléfono a <span class="player-highlight">${esc(player.name)}</span>.</h2><p class="lead">Asegúrate de que nadie más mire. Cuando estés a solas, toca para ver los personajes de los demás.</p><div class="panel"><div class="notice">🙈 Tu personaje siempre estará oculto. No enseñes la pantalla mientras la revisas.</div><button class="button button-primary" type="button" data-action="open-reveal">Soy ${esc(player.name)}, ver personajes</button></div></section>`;
}
function characterList(viewerIndex){
  return `<div class="list">${state.players.map((player,index)=>{
    const own=index===viewerIndex;const known=player.guessed;
    const content=own?`<div class="character-name">??? <span class="own-tag">· ¡Ese eres tú!</span></div><div class="character-anime">🔒 Personaje oculto</div>`:`<div class="character-name">${esc(player.character.name)}</div><div class="character-anime">${esc(player.character.anime)}</div>`;
    const marker=own?'?':initials(player.name);
    return `<div class="character-row ${own?'own':''}"><div class="avatar" aria-hidden="true">${own?'🔒':esc(marker)}</div><div class="character-info"><div class="character-name">${esc(player.name)}</div>${content}</div>${known&&!own?'<span class="winner-badge">Adivinó</span>':''}</div>`;
  }).join('')}</div>`;
}
function openReveal(){state.revealOpen=true;renderReveal();}
function renderReveal(){
  const isRecall=state.recallIndex!==null;const viewerIndex=isRecall?state.recallIndex:state.revealIndex;const viewer=playerByIndex(viewerIndex);
  app.innerHTML=`<section class="screen"><div class="revealed-header"><p class="eyebrow">Vista secreta · solo ${esc(viewer.name)}</p><h2>Los personajes de la mesa</h2><p>Observa a todos menos a ti. Tu identidad está bloqueada a propósito.</p></div>${characterList(viewerIndex)}<button class="button button-primary" type="button" data-action="close-reveal">${isRecall?'Listo, volver a la ronda':'Listo, ocultar y pasar al siguiente'} <span aria-hidden="true">→</span></button></section>`;
}
function nextSetup(){
  state.revealOpen=false;
  if(state.recallIndex!==null){state.recallIndex=null;state.screen='round';render();return;}
  state.revealIndex++;
  if(state.revealIndex>=state.players.length){state.turnIndex=0;state.screen='round';}else state.screen='setup';
  render();
}
function currentTurn(){
  if(!state.players.length)return null;
  if(!state.players[state.turnIndex]||state.players[state.turnIndex].guessed){const next=nextActiveIndex(state.turnIndex-1);state.turnIndex=next;}
  return state.players[state.turnIndex]||null;
}
function nextActiveIndex(from){
  const total=state.players.length;
  for(let step=1;step<=total;step++){const index=(from+step+total)%total;if(!state.players[index].guessed)return index;}
  return -1;
}
function advanceTurn(){const next=nextActiveIndex(state.turnIndex);if(next<0){finishGame();return;}state.turnIndex=next;render();}
function markGuessed(){
  const player=currentTurn();if(!player)return;player.guessed=true;
  if(activePlayers().length===0){finishGame();return;}
  state.turnIndex=nextActiveIndex(state.turnIndex);render();showToast(`${player.name} lo adivinó. ¡Bien jugado!`);
}
function renderRound(){
  if(activePlayers().length===0){finishGame();return;}
  const player=currentTurn();const completed=state.players.length-activePlayers().length;
  app.innerHTML=`<section class="screen"><div class="round-top"><p class="eyebrow" style="margin:0">Ronda de preguntas</p><span class="pill">${completed}/${state.players.length} adivinados</span></div><div class="turn-card"><div class="turn-label">Turno de preguntar</div><div class="turn-name">${esc(player.name)}</div><div class="turn-hint">Haz una pregunta que se responda con sí o no.</div></div><button class="button button-primary" type="button" data-action="guess">¡${esc(player.name)} adivinó su personaje! 🎉</button><button class="button button-secondary" style="margin-top:10px" type="button" data-action="next-turn">Pasar al siguiente turno <span aria-hidden="true">→</span></button><div class="status-title"><span>Estado de la partida</span><span class="subtle">${activePlayers().length} por descubrir</span></div><div class="status-list">${state.players.map(person=>`<div class="status-row ${person.guessed?'done':''}"><div><div class="status-name">${esc(person.name)}</div>${person.guessed?`<div class="status-character">${esc(person.character.name)} · ${esc(person.character.anime)}</div>`:''}</div><span class="status-state">${person.guessed?'✓ Adivinó':'Jugando'}</span></div>`).join('')}</div><div class="round-actions"><div class="secondary-actions"><button class="button button-quiet button-small" type="button" data-action="recall">👀 Olvidé los personajes</button><button class="button button-quiet button-small" type="button" data-action="finish">Terminar ronda</button></div></div><p class="footnote">Las preguntas se hacen en voz alta. Pasa el teléfono solo para consultas privadas.</p></section>`;
}
function finishGame(){state.screen='summary';state.recallIndex=null;render();}
function renderSummary(){
  const winners=state.players.filter(player=>player.guessed).length;
  app.innerHTML=`<section class="screen"><div class="summary-hero"><p class="eyebrow">Fin de la ronda</p><h2>${winners===state.players.length?'¡Misión cumplida!':'¡Se revelan las cartas!'}</h2><p>${winners===state.players.length?'Todo el grupo descubrió su identidad.':'Así queda el misterio de la mesa.'} ${winners} de ${state.players.length} adivinaron.</p></div><div class="panel"><div class="section-head"><span class="section-title">El reparto completo</span><span class="pill">${categoryNames[state.category]}</span></div><div class="list">${state.players.map(player=>`<div class="character-row"><div class="avatar">${esc(initials(player.name))}</div><div class="character-info"><div class="character-name">${esc(player.name)} <span class="winner-badge">${player.guessed?'· Adivinó':'· Revelado'}</span></div><div class="character-anime">${esc(player.character.name)} · ${esc(player.character.anime)}</div></div></div>`).join('')}</div></div><button class="button button-primary" style="margin-top:18px" type="button" data-action="replay">Jugar otra ronda <span aria-hidden="true">↻</span></button><button class="button button-quiet button-small" style="margin-top:10px" type="button" data-action="home">Volver al lobby</button><p class="footnote">Los nombres y la categoría se mantienen; los personajes se vuelven a sortear.</p></section>`;
}

function showRecallDialog(){
  const turn=currentTurn();
  overlayRoot.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="recall-title"><h2 id="recall-title">Consulta rápida</h2><p>Elige quién está tomando el teléfono. ¿Seguro que eres <strong id="recall-confirm-name">${esc(turn.name)}</strong>? Solo verá los personajes de los demás.</p><label class="field-label" for="recall-player">Soy…</label><div class="select-wrap"><select id="recall-player">${state.players.map((player,index)=>`<option value="${index}" ${player.id===turn.id?'selected':''}>${esc(player.name)}</option>`).join('')}</select></div><button class="button button-primary" type="button" data-action="confirm-recall">Sí, soy esa persona</button><button class="button button-quiet button-small" type="button" data-action="cancel-modal">Cancelar</button></section></div>`;
  document.getElementById('recall-player')?.focus();
}
function beginRecall(){
  const selector=document.getElementById('recall-player');if(!selector)return;
  state.recallIndex=Number(selector.value);state.revealOpen=false;state.screen='setup';render();
}
function replay(){
  state.names=state.players.map(player=>player.name);state.count=state.players.length;state.screen='lobby';startGame();
}
function goHome(){
  state.names=state.players.map(player=>player.name);state.count=state.players.length;state.players=[];state.screen='lobby';render();
}
document.addEventListener('input',event=>{
  const input=event.target.closest('[data-name]');if(input){state.names[Number(input.dataset.name)]=input.value;input.classList.remove('invalid');}
});
document.addEventListener('change',event=>{
  if(event.target.id==='category')state.category=event.target.value;
  if(event.target.id==='recall-player'){const target=playerByIndex(Number(event.target.value));const label=document.getElementById('recall-confirm-name');if(label&&target)label.textContent=target.name;}
});
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  switch(button.dataset.action){
    case 'minus': if(state.count>2){syncLobby();state.count--;state.names.length=state.count;renderLobby();}break;
    case 'plus': if(state.count<12){syncLobby();state.count++;state.names.length=state.count;renderLobby();}break;
    case 'start': startGame();break;
    case 'open-reveal':openReveal();break;
    case 'close-reveal':nextSetup();break;
    case 'next-turn':advanceTurn();break;
    case 'guess':markGuessed();break;
    case 'finish':finishGame();break;
    case 'recall':showRecallDialog();break;
    case 'confirm-recall':beginRecall();break;
    case 'cancel-modal':overlayRoot.innerHTML='';break;
    case 'replay':replay();break;
    case 'home':goHome();break;
  }
});
render();
</script>
</body>
</html>
